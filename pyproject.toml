[project]
name = "gazefocus"
version = "0.1.0"
description = "Webcam focus-follows-gaze for a two-monitor Windows desk"
requires-python = "==3.12.*"
dependencies = [
  "mediapipe==1.0.1",
  "opencv-contrib-python==5.0.0.93",
  "numpy>=2.0",
  "PySide6==6.11.2",
  "comtypes==1.4.17",
  "psutil==7.2.2",
]
# Never add opencv-python: mediapipe already pulls opencv-contrib-python (conflicting cv2).

[project.scripts]
gazefocus = "gazefocus.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazefocus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
