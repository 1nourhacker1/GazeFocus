[project]
name = "gazefocus"
version = "0.1.0"
description = "Webcam focus-follows-gaze for a laptop and one external monitor on Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
  "mediapipe==1.0.1",
  "opencv-contrib-python==5.0.0.93",
  "numpy>=2.0",
  "PySide6==6.11.2",
  "comtypes==1.4.17",
  "psutil==7.2.2",
]
# Never add opencv-python: mediapipe already pulls opencv-contrib-python (conflicting cv2).

[project.scripts]
gazefocus = "gazefocus.__main__:main"

[project.gui-scripts]
# .venv\Scripts\gazefocus-app.exe: the background app with no console window (for shortcuts and Startup)
gazefocus-app = "gazefocus.app.main:gui_main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazefocus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008",  # frozen-dataclass defaults are safe
  "B905",  # zip() lengths are checked where it matters
  "E741",  # l, w: the Win32 names (lParam, wParam)
  "E731",  # small lambdas in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # some tests set the environment before importing
