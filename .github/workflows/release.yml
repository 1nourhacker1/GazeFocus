name: release

# Builds the standalone download and attaches it to a release:
# on publishing a release, or by hand (Actions -> release -> Run workflow) for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  standalone:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python scripts/fetch_model.py
      - run: uv run --with pyinstaller==6.22.3 python scripts/build_standalone.py
      - run: gh release upload $env:TAG (Get-ChildItem dist/*.zip).FullName --clobber
        env:
          GH_TOKEN: ${{ github.token }}
